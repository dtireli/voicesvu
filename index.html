<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOICES — The network for innovators, artists and writers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #020609;
      color: #fff;
      overflow: hidden;
    }

    canvas#bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 25%, rgba(2,6,9,0.65) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .hero {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      text-align: center;
      padding: 0 1.5rem;
    }

    h1 {
      font-family: 'Roboto Mono', monospace;
      font-weight: 500;
      font-size: clamp(2.5rem, 8vw, 6.5rem);
      letter-spacing: -0.03em;
      line-height: 1;
      text-shadow: 0 0 60px rgba(20, 180, 200, 0.15);
    }

    .tagline {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(0.85rem, 1.8vw, 1.05rem);
      letter-spacing: 0.08em;
      opacity: 0.55;
    }

    .actions {
      margin-top: 0.5rem;
    }

    .cta {
      display: inline-block;
      padding: 0.85rem 3rem;
      background: #fff;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      border-radius: 50px;
      text-decoration: none;
      transition: background 0.25s, color 0.25s, box-shadow 0.25s;
    }

    .cta:hover {
      background: rgba(255,255,255,0.88);
      box-shadow: 0 0 30px rgba(255,255,255,0.2);
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      right: 2rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.2;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>

  <main class="hero">
    <h1>VOICES</h1>
    <p class="tagline">The network for innovators, artists and writers.</p>
    <div class="actions">
      <a href="https://social.voices.vu/about" class="cta">Sign Up or Log In</a>
    </div>
  </main>

  <footer>© VOICES 2026</footer>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      // Re-fill with bg colour on resize so trails don't streak
      ctx.fillStyle = '#020609';
      ctx.fillRect(0, 0, W, H);
    }
    resize();
    window.addEventListener('resize', resize);

    // Limited palette: deep teal-blue family, ink-in-water feel
    const inkColors = [
      [15,  140, 180],  // deep teal
      [20,  100, 200],  // ocean blue
      [10,  180, 160],  // sea green
      [40,  160, 220],  // sky-teal
      [80,  200, 210],  // light cyan highlight
      [10,   80, 160],  // deep indigo
    ];

    function rndInk() {
      return inkColors[Math.floor(Math.random() * inkColors.length)];
    }

    // Layered noise approximation — smooth and organic
    function noise(x, y, t) {
      return (
        Math.sin(x * 1.1 + y * 0.6 + t * 0.7)  * 0.50 +
        Math.sin(x * 2.4 - y * 1.8 + t * 1.1)  * 0.25 +
        Math.sin(x * 0.6 + y * 2.3 - t * 0.5)  * 0.15 +
        Math.sin(x * 3.1 - y * 0.4 + t * 1.7)  * 0.10
      );
    }

    // Flow field particles
    const PARTICLE_COUNT = 480;
    const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
      x:         Math.random() * (window.innerWidth  || 1400),
      y:         Math.random() * (window.innerHeight || 900),
      vx:        0,
      vy:        0,
      speed:     0.4 + Math.random() * 2.2,
      lineWidth: 0.3 + Math.random() * 2.8,
      opacity:   0.06 + Math.random() * 0.28,
      color:     rndInk(),
      life:      Math.random(),         // stagger initial positions
      maxLife:   0.6 + Math.random() * 0.4,
    }));

    function resetParticle(p) {
      p.x = Math.random() * W;
      p.y = Math.random() * H;
      p.vx = 0;
      p.vy = 0;
      p.life = 0;
      p.speed = 0.4 + Math.random() * 2.2;
      p.lineWidth = 0.3 + Math.random() * 2.8;
      p.opacity = 0.06 + Math.random() * 0.28;
      p.color = rndInk();
      p.maxLife = 0.6 + Math.random() * 0.4;
    }

    let t = 0;

    function draw() {
      // Fade rather than clear — trails persist and dissolve like ink
      ctx.fillStyle = 'rgba(2, 6, 9, 0.04)';
      ctx.fillRect(0, 0, W, H);

      t += 0.0015;

      particles.forEach(p => {
        p.life += 0.004;
        if (p.life > p.maxLife || p.x < 0 || p.x > W || p.y < 0 || p.y > H) {
          resetParticle(p);
          return;
        }

        // Sample noise field to get flow angle
        const nx = (p.x / W)  * 3.5;
        const ny = (p.y / H)  * 3.5;
        const angle = noise(nx, ny, t) * Math.PI * 2.8;

        // Smooth velocity update
        const ax = Math.cos(angle) * p.speed;
        const ay = Math.sin(angle) * p.speed;
        p.vx = p.vx * 0.85 + ax * 0.15;
        p.vy = p.vy * 0.85 + ay * 0.15;

        // Fade in/out over lifetime
        const lifeFrac = p.life / p.maxLife;
        const fade = lifeFrac < 0.15
          ? lifeFrac / 0.15
          : lifeFrac > 0.75
            ? 1 - (lifeFrac - 0.75) / 0.25
            : 1;

        const [r, g, b] = p.color;
        ctx.strokeStyle = `rgba(${r},${g},${b},${p.opacity * fade})`;
        ctx.lineWidth   = p.lineWidth;
        ctx.lineCap     = 'round';

        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        p.x += p.vx;
        p.y += p.vy;
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      });

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
