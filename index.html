<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOICES — The network for innovators, artists and writers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #050510;
      color: #fff;
      overflow: hidden;
    }

    canvas#bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Vignette to push focus to center */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.6) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .hero {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      text-align: center;
      padding: 0 1.5rem;
    }

    h1 {
      font-family: 'Roboto Mono', monospace;
      font-weight: 500;
      font-size: clamp(2.5rem, 8vw, 6.5rem);
      letter-spacing: -0.03em;
      line-height: 1;
      text-shadow: 0 0 80px rgba(255,255,255,0.08);
    }

    .tagline {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(0.85rem, 1.8vw, 1.05rem);
      letter-spacing: 0.08em;
      opacity: 0.6;
    }

    .actions {
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .cta {
      display: inline-block;
      padding: 0.7rem 2.5rem;
      background: #fff;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.25s, color 0.25s, outline 0.25s;
    }

    .cta:hover {
      background: transparent;
      color: #fff;
      outline: 1px solid rgba(255,255,255,0.6);
    }

    .login-link {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .login-link:hover {
      color: rgba(255,255,255,0.85);
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      right: 2rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.25;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>

  <main class="hero">
    <h1>VOICES</h1>
    <p class="tagline">The network for innovators, artists and writers.</p>
    <div class="actions">
      <a href="/auth/sign_up" class="cta">Sign Up</a>
      <a href="/auth/sign_in" class="login-link">Log in</a>
    </div>
  </main>

  <footer>© VOICES 2026</footer>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Mouse influence
    let mouse = { x: 0, y: 0 };
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    const palette = [
      [130, 80, 255],   // violet
      [80, 120, 255],   // indigo-blue
      [200, 80, 255],   // purple-pink
      [80, 200, 255],   // cyan
      [255, 100, 180],  // rose
      [255, 180, 80],   // warm amber
    ];

    function rndColor() {
      return palette[Math.floor(Math.random() * palette.length)];
    }

    // Background filler waves — many thin, fast, colored
    const bgWaves = Array.from({ length: 18 }, (_, i) => ({
      slot: i,
      amplitude: 40 + Math.random() * 90,
      frequency: 0.003 + Math.random() * 0.007,
      speed:     (0.006 + Math.random() * 0.012) * (Math.random() > 0.5 ? 1 : -1),
      phase:     Math.random() * Math.PI * 2,
      harmonic:  0.001 + Math.random() * 0.004,
      hMix:      0.25 + Math.random() * 0.5,
      opacity:   0.08 + Math.random() * 0.14,
      lineWidth: 0.6 + Math.random() * 1.2,
      color:     rndColor(),
    }));

    // Hero waves — fewer, thicker, glowing, slower
    const heroWaves = Array.from({ length: 5 }, (_, i) => ({
      slot: i,
      amplitude: 80 + Math.random() * 140,
      frequency: 0.0015 + Math.random() * 0.003,
      speed:     (0.0025 + Math.random() * 0.006) * (Math.random() > 0.5 ? 1 : -1),
      phase:     Math.random() * Math.PI * 2,
      harmonic:  0.0008 + Math.random() * 0.002,
      hMix:      0.3 + Math.random() * 0.4,
      opacity:   0.28 + Math.random() * 0.28,
      lineWidth: 1.5 + Math.random() * 2.5,
      glowSize:  16 + Math.random() * 22,
      color:     rndColor(),
    }));

    function drawWave(wave, baseY, mouseInfluence) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 2) {
        // Mouse proximity warps the wave locally
        const dx = x - mouse.x;
        const dist = Math.sqrt(dx * dx + (baseY - mouse.y) ** 2);
        const pull = mouseInfluence * Math.exp(-dist * dist / (W * 0.08)) * 60;

        const y = baseY
          + Math.sin(x * wave.frequency + wave.phase) * wave.amplitude
          + Math.sin(x * wave.harmonic  + wave.phase * 0.7) * wave.amplitude * wave.hMix
          + pull;

        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Background waves — no glow, distributed evenly
      ctx.shadowBlur = 0;
      bgWaves.forEach((wave, i) => {
        wave.phase += wave.speed;
        const baseY = H * (i + 1) / (bgWaves.length + 1);
        const [r, g, b] = wave.color;
        ctx.strokeStyle = `rgba(${r},${g},${b},${wave.opacity})`;
        ctx.lineWidth = wave.lineWidth;
        drawWave(wave, baseY, 0.4);
      });

      // Hero waves — glowing, centered cluster
      heroWaves.forEach((wave, i) => {
        wave.phase += wave.speed;
        const baseY = H * 0.25 + (H * 0.5) * (i / (heroWaves.length - 1));
        const [r, g, b] = wave.color;
        ctx.shadowColor = `rgba(${r},${g},${b},0.8)`;
        ctx.shadowBlur  = wave.glowSize;
        ctx.strokeStyle = `rgba(${r},${g},${b},${wave.opacity})`;
        ctx.lineWidth   = wave.lineWidth;
        drawWave(wave, baseY, 0.9);
      });

      ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
